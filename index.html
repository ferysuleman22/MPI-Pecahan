    <script>
        /* === KONFIGURASI GOOGLE APPS SCRIPT === */
        // Ganti URL di bawah ini dengan URL Web App dari Google Apps Script Anda
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxRa4J7NtSz2oUOw0teLuYOyNyd_rDi2lHPrr7Hs1wCXpWB-MZD8fjkRzjvPUm1CbWy3A/exec";

        /* === STATE MANAGEMENT === */
        const state = {
            student: { name: '', class: '' },
            progress: { learn: 0, play: 0, practice: 0 },
            unlocked: { play: false, practice: false },
            scores: { play: 0, practice: 0 },
            currentPlayHasError: false,
            currentPlayPoints: 0,
            currentPracticePoints: 0,
            currentPracticeSelected: null,
            incorrectPractice: [],
            practiceHistory: [] // Menyimpan seluruh rekam jejak jawaban siswa
        };

        /* === UI UTILS === */
<!-- ... existing code ... -->
        function selectPractice(selected, correct, btnElem, pts) {
            const btns = document.getElementById('practiceOptions').querySelectorAll('.option-btn');
            btns.forEach(b => {
                b.classList.remove('selected');
                b.disabled = true; // Lock answer after selecting
            });
            btnElem.classList.add('selected');
            
            state.currentPracticeSelected = selected;
            state.currentPracticePoints = (selected === correct) ? pts : 0;
            document.getElementById('btnPracticeNext').style.display = 'block';
        }

        function nextPracticeSlide() {
            const data = practiceData[state.progress.practice];
            
            // Evaluasi jawaban
            const isCorrect = state.currentPracticeSelected === data.ans;
            const userAns = state.currentPracticeSelected !== null ? data.opts[state.currentPracticeSelected] : "Tidak Dijawab";
            
            // Catat history lengkap untuk Google Sheets
            if (!state.practiceHistory) state.practiceHistory = [];
            state.practiceHistory.push({
                q: data.stimulus,
                userAns: userAns,
                correctAns: data.opts[data.ans],
                status: isCorrect ? "Benar" : "Salah"
            });

            // Catat jawaban salah untuk dibahas
            if (!isCorrect) {
                state.incorrectPractice.push({
                    q: data.stimulus,
                    wrongAns: userAns,
                    correctAns: data.opts[data.ans],
                    pembahasan: data.pembahasan
                });
            }

            state.scores.practice += state.currentPracticePoints;
            
            if(state.progress.practice < 14) {
                state.progress.practice++;
                state.currentPracticeSelected = null; // Reset selection
                renderPractice();
            } else {
                // Semua soal selesai, submit ke backend (GAS)
                submitDataToGAS();
            }
        }

        /* === LOGIC: SUBMIT TO GOOGLE APPS SCRIPT === */
        function submitDataToGAS() {
            if (!GAS_URL || GAS_URL === "URL_GAS_ANDA_DISINI") {
                console.warn("GAS_URL belum diatur. Melewati proses sinkronisasi database.");
                navTo('screen-report');
                renderReport();
                return;
            }

            // Membekukan UI sebentar untuk proses penyimpanan
            document.getElementById('btnPracticeNext').disabled = true;
            document.getElementById('btnPracticeNext').innerText = "Menyimpan Data...";
            showToast("Menyinkronkan data dengan server...", true);

            // Siapkan Data Soal (Digabung dari Bermain & Berlatih untuk menginisialisasi sheet Data Soal)
            const soalData = [];
            playData.forEach(item => {
                soalData.push({ kategori: "Bermain", level: "-", soal: item.stimulus, opsi: item.opts.join(" | "), kunci: item.opts[item.ans] });
            });
            practiceData.forEach(item => {
                let lvl = item.level === 1 ? "Dasar" : (item.level === 2 ? "Aplikasi" : "HOTS");
                soalData.push({ kategori: "Berlatih", level: lvl, soal: item.stimulus, opsi: item.opts.join(" | "), kunci: item.opts[item.ans] });
            });

            // Hitung total benar dan salah
            const benar = state.practiceHistory.filter(x => x.status === "Benar").length;
            const salah = state.practiceHistory.length - benar;

            const payload = {
                type: "submit_hasil",
                nama: state.student.name,
                kelas: state.student.class,
                benar: benar,
                salah: salah,
                skorBermain: state.scores.play > 100 ? 100 : state.scores.play,
                skorBerlatih: state.scores.practice,
                detail: state.practiceHistory,
                soalData: soalData
            };

            fetch(GAS_URL, {
                method: "POST",
                // Menggunakan text/plain agar tidak terblokir masalah CORS Preflight
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                    showToast("Data berhasil direkam ke Google Sheets!");
                } else {
                    showToast("Gagal menyimpan data ke database.", false);
                    console.error("Kesalahan GAS:", data.error);
                }
            })
            .catch(err => {
                showToast("Terjadi kesalahan jaringan saat menyimpan data.", false);
                console.error("Network Error:", err);
            })
            .finally(() => {
                // Lanjutkan ke menu Rapor apapun hasil network requestnya
                navTo('screen-report');
                renderReport();
            });
        }
